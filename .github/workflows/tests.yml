name: E2E Tests

# Запускається автоматично на кожен push і кожен pull request у main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Дозволяє запустити вручну з вкладки Actions на GitHub, якщо треба.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Якщо на main прилітає кілька push поспіль, не публікуємо звіти
# один поверх одного одночасно — новий деплой чекає завершення попереднього.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      # Playwright сам качає Chromium (і mongodb-memory-server окремо якає
      # тимчасовий mongod) — ніякого Docker чи окремих сервісів не треба.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run e2e tests
        run: npm test
        working-directory: e2e

      # Звіт зберігаємо як build-артефакт незалежно від результату тестів —
      # так його можна завантажити й подивитись навіть якщо щось впало.
      - name: Upload report as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 30

      - name: Upload report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: e2e/playwright-report

  deploy-report:
    name: Publish report to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
